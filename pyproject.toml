[project]
name = "xaw-pbe"
version = "1.0.0"
description = "Python backend for XAW"
authors = [{ name = "Robert King", email = "varitonium@gmail.com" }]
readme = "README.md"

requires-python = ">=3.10,<4.0"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.7,<3.0",
    "fastapi[standard]",
    "httpx2",
    "uvicorn[standard]>=0.30,<1.0",
]

# uv includes dev by default; use `uv sync --no-dev` for runtime only.
[dependency-groups]
dev = [
    "black>=24,<27",
    "pycodestyle>=2.12,<3",
    "pydocstyle>=6.3,<7",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-html>=4.1,<5",
    "ruff>=0.6,<1",
    "bandit>=1.7,<2",
    "coverage>=7.6,<8",
]
docs = [
    "sphinx>=8,<9",
    "furo>=2024.8.6",
]

[tool.uv]
package = false
